name: Build citron-room (Linux, minimal)

on:
  workflow_dispatch: {}

jobs:
  build:
    name: "citron-room (x86_64)"
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install Git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Add Git Safe Directory
        run: git config --global --add safe.directory "$PWD"

      - name: Install dependencies (same set the official Linux nightly build uses)
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel boost boost-libs clang cmake curl enet fmt ffmpeg \
            gcc git glslang glu hidapi libvpx libxi libxkbcommon-x11 libxss \
            lld llvm nasm ninja nlohmann-json numactl openal patchelf \
            pulseaudio pulseaudio-alsa unzip vulkan-headers vulkan-mesa-layers \
            wget xcb-util-cursor xcb-util-image xcb-util-renderutil xcb-util-wm \
            zip zsync

      - name: Patch for newer Boost/CMake compatibility
        run: |
          find . -type f \( -name '*.cpp' -o -name '*.h' \) | xargs -r sed -i 's/\bboost::asio::io_service\b/boost::asio::io_context/g'
          find . -type f \( -name '*.cpp' -o -name '*.h' \) | xargs -r sed -i 's/\bboost::asio::io_service::strand\b/boost::asio::strand<boost::asio::io_context::executor_type>/g'
          find . -type f \( -name '*.cpp' -o -name '*.h' \) | xargs -r sed -i 's|#include *<boost/process/async_pipe.hpp>|#include <boost/process/v1/async_pipe.hpp>|g'
          find . -type f \( -name '*.cpp' -o -name '*.h' \) | xargs -r sed -i 's/\bboost::process::async_pipe\b/boost::process::v1::async_pipe/g'
          sed -i '/sse2neon/d' ./src/video_core/CMakeLists.txt
          sed -i 's/cmake_minimum_required(VERSION 2.8)/cmake_minimum_required(VERSION 3.5)/' externals/xbyak/CMakeLists.txt

      - name: Configure (room server only, no GUI/tests)
        run: |
          mkdir build && cd build
          cmake .. -GNinja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_QT=OFF -DENABLE_SDL2=OFF \
            -DCITRON_TESTS=OFF -DCITRON_CHECK_SUBMODULES=OFF \
            -DCITRON_ENABLE_LTO=OFF \
            -DENABLE_WEB_SERVICE=ON -DENABLE_OPENSSL=ON \
            -DCMAKE_CXX_FLAGS="-Wno-error -w" -DCMAKE_C_FLAGS="-Wno-error -w" \
            -DCMAKE_BUILD_TYPE=Release -DCITRON_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build citron-room
        run: cd build && ninja -j$(nproc) citron-room

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: citron-room-linux-x86_64
          path: build/bin/citron-room
          if-no-files-found: error
